<style>

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.metric,.panel{background:#fff;border:1px solid #e3e6df;border-radius:14px;padding:20px}.metric span{display:block;color:#758079;font-size:12px}.metric b{font-size:30px}.loan{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #edf0eb}.loan>div:nth-child(2){flex:1}.mini{width:42px;height:54px;border-radius:5px;background:#315b49;color:#fff;display:grid;place-items:center;font-weight:900}.loan span{display:block;color:#7a847f;font-size:12px;margin-top:3px}.loan button,.admin-btn{background:#eef2ed;color:#17352a;padding:7px 10px;border-radius:7px;font-weight:800}.admin-btn.danger{background:#f8e9e8;color:#963f3b}
.dashboard-grid,.admin-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.searchbox{background:#fff;border:1px solid #dfe2dc;padding:12px 15px;border-radius:10px;width:320px}.searchbox input{border:0;outline:0;width:100%}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.chip{background:#fff;border:1px solid #dfe2dc;border-radius:999px;padding:8px 13px}.chip.active{background:#17352a;color:#fff}
.details{display:grid;grid-template-columns:280px 1fr;gap:50px;max-width:950px;margin:20px auto 60px}.details .cover{height:380px}.details h1{font-size:50px;margin:8px 0}.meta{display:flex;gap:40px;margin:25px 0}.meta small{display:block;color:#8b948f}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tag{background:#eef1eb;padding:7px 10px;border-radius:999px;font-size:12px}
.table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0eb;font-size:13px}.admin-table th{font-size:11px;color:#77817b;text-transform:uppercase}.status-pill{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.status-green{background:#e8f3ea;color:#2f7545}.status-red{background:#f7e9e8;color:#984945}
.admin-shell{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 70px);background:#f3f5f1}.admin-side{background:#17352a;color:#fff;padding:22px 14px;position:sticky;top:70px;height:calc(100vh - 70px)}.admin-side button{width:100%;text-align:left;background:transparent;color:#c9d5cf;padding:11px 12px;border-radius:8px;font-weight:700}.admin-side button.active,.admin-side button:hover{background:#ffffff14;color:#fff}.admin-main{padding:30px 4%}.admin-card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.admin-stat{background:#fff;border:1px solid #e0e5df;border-radius:13px;padding:18px}.admin-stat small{display:block;color:#77817c}.admin-stat strong{display:block;font-size:30px;margin-top:5px}.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.admin-top h1{margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.member-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.member-nav button{background:#fff;border:1px solid #dfe3dc;padding:9px 13px;border-radius:9px;font-weight:800}.member-nav button.active{background:#17352a;color:#fff}
.toast{position:fixed;right:20px;bottom:20px;max-width:420px;background:#17352a;color:#fff;padding:13px 17px;border-radius:10px;z-index:100;box-shadow:0 12px 30px #0003}.footer{padding:30px;text-align:center;border-top:1px solid #e5e7e1;color:#7a837e}
@media(max-width:950px){.hero,.details,.dashboard-grid,.admin-cols{grid-template-columns:1fr}.book-grid{grid-template-columns:repeat(2,1fr)}.metrics,.admin-card-grid{grid-template-columns:repeat(2,1fr)}.navlinks{display:none}.nav-search{margin-left:auto;width:170px}.admin-shell{grid-template-columns:1fr}.admin-side{position:static;height:auto;display:flex;overflow:auto;gap:5px}.admin-side button{width:auto;white-space:nowrap}.admin-main{padding:22px 4%}}
@media(max-width:560px){.book-grid{grid-template-columns:1fr}.metrics,.admin-card-grid,.profile-grid,.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.nav{padding:0 4%}.nav-search{width:140px}.hero h1{font-size:44px;letter-spacing:-2px}.details .cover{height:300px}.details h1{font-size:38px}}

<body>
<div id="app"></div>

<script>
const API_BASE = window.ROYAL_LIBRARY_API || window.location.origin + '/api';
let currentUser = null;
let authToken = localStorage.getItem('royal_library_token') || '';

async function api(path, options={}) {
  const headers = {'Content-Type':'application/json', ...(options.headers||{})};
  if (authToken) headers.Authorization = `Bearer ${authToken}`;
  const res = await fetch(API_BASE + path, {...options, headers});
  let body = {};
  try { body = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error(body.error || body.message || `Request failed (${res.status})`);
  return body;
}
function setAuth(token,user){
  authToken = token || '';
  currentUser = user || null;
  if(token) localStorage.setItem('royal_library_token', token);
  else localStorage.removeItem('royal_library_token');
}

/* =========================
   ROYAL LIBRARY — SUPABASE
   ========================= */
const API_BASE = window.ROYAL_LIBRARY_API || window.location.origin + '/api';
let currentUser = null;


let state={
  page:'home', query:'', category:'All', selected:null, user:null,
  books:[], categories:[], borrowings:[], favourites:[], preferences:[],
  notifications:[], activities:[], users:[], audit:[],
  adminTab:'overview', memberTab:'overview', editingBook:null, selectedMember:null
};

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(message,type=''){state.toast={message,type};render();clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{state.toast=null;render()},4000)}
function loading(message='Loading…'){return `<div class="page"><div class="notice">${esc(message)}</div></div>`}
function dateOnly(d){return d?new Date(d).toLocaleDateString():''}
function initials(s){return esc((s||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}
function getCategory(id){return state.categories.find(c=>c.id===id)?.name||'Uncategorized'}
function mapBook(b){return {...b,category:getCategory(b.category_id),availability:(b.available_copies||0)>0}}
function activeLoans(){return state.borrowings.filter(x=>x.status==='borrowed'||x.status==='overdue')}
function overdue(x){return x.status==='overdue'||(x.status==='borrowed'&&new Date(x.due_date+'T23:59:59')<new Date())}

async function apiError(error,context){
  console.error(context,error);
  if(!error)return;
  if(error.name==='TypeError'||/fetch|network|failed/i.test(error.message||'')){
    toast('Cannot reach Supabase. Check your internet connection, Supabase project URL, and browser network access. Open the browser console for details.','error');
  }else toast(error.message||`${context} failed`,'error');
}

/* ---------- data loading ---------- */
async function loadPublic(){
  const [books,cats]=await Promise.all([
    renderDbRemoved.from('books').select('*').order('created_at',{ascending:false}),
    renderDbRemoved.from('categories').select('*').order('name')
  ]);
  if(books.error){await apiError(books.error,'Loading books');return false}
  if(cats.error){await apiError(cats.error,'Loading categories');return false}
  state.categories=cats.data||[];
  state.books=(books.data||[]).map(mapBook);
  return true;
}

async function loadUser(){
  const {data,error}=await renderAuthRemoved.getSession();
  if(error){await apiError(error,'Checking session');return false}
  state.user=null; state.borrowings=[]; state.favourites=[]; state.preferences=[]; state.notifications=[]; state.activities=[];
  if(!data.session)return true;

  const uid=data.session.user.id;
  const p=await renderDbRemoved.from('profiles').select('*').eq('id',uid).maybeSingle();
  if(p.error){await apiError(p.error,'Loading profile');return false}
  if(!p.data){toast('Your Auth account exists but its library profile was not created. Check the Supabase profile trigger.','error');return false}
  state.user={...p.data,name:p.data.full_name,active:p.data.status==='active'};

  const [bor,fav,pref,notifs,acts]=await Promise.all([
    renderDbRemoved.from('borrowings').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
    renderDbRemoved.from('favourites').select('book_id').eq('user_id',uid),
    renderDbRemoved.from('user_preferences').select('category_id').eq('user_id',uid),
    renderDbRemoved.from('notifications').select('*').eq('user_id',uid).order('created_at',{ascending:false}).limit(30),
    renderDbRemoved.from('activities').select('*').eq('user_id',uid).order('created_at',{ascending:false}).limit(200)
  ]);
  if(bor.error||fav.error||pref.error||notifs.error||acts.error){
    const e=bor.error||fav.error||pref.error||notifs.error||acts.error;
    await apiError(e,'Loading member data');return false;
  }
  state.borrowings=bor.data||[];
  state.favourites=(fav.data||[]).map(x=>x.book_id);
  state.preferences=(pref.data||[]).map(x=>x.category_id);
  state.notifications=notifs.data||[];
  state.activities=acts.data||[];

  if(state.user.role==='admin')await loadAdminData();
  return true;
}

async function loadAdminData(){
  const [profiles,bor,audit]=await Promise.all([
    renderDbRemoved.from('profiles').select('*').order('created_at',{ascending:false}),
    renderDbRemoved.from('borrowings').select('*').order('created_at',{ascending:false}),
    renderDbRemoved.from('admin_logs').select('*').order('created_at',{ascending:false}).limit(100)
  ]);
  const e=profiles.error||bor.error||audit.error;
  if(e){await apiError(e,'Loading admin data');return}
  state.users=profiles.data||[];
  state.borrowings=bor.data||[];
  state.audit=audit.data||[];
}

/* ---------- auth ---------- */
async function registerAction(){
  const name=$('regName').value.trim(),email=$('regEmail').value.trim().toLowerCase();
  const password=$('regPassword').value,confirm=$('regConfirm').value;
  if(name.length<2)return toast('Enter your full name.','error');
  if(!/^\S+@\S+\.\S+$/.test(email))return toast('Enter a valid email address.','error');
  if(password.length<6)return toast('Password must be at least 6 characters.','error');
  if(password!==confirm)return toast('Passwords do not match.','error');

  const {data,error}=await renderAuthRemoved.signUp({
    email,password,
    options:{data:{full_name:name}}
  });
  if(error){await apiError(error,'Account creation');return}

  if(!data.session){
    state.page='login';render();
    toast('Account created. Check your email to confirm the account.','success');
    return;
  }
  await loadPublic();await loadUser();
  state.page='dashboard';state.memberTab='overview';render();
  toast('Account created successfully.','success');
}

async function loginAction(){
  const email=$('email').value.trim().toLowerCase(),password=$('password').value;
  if(!email||!password)return toast('Enter your email and password.','error');
  const {error}=await renderAuthRemoved.signInWithPassword({email,password});
  if(error){await apiError(error,'Sign in');return}
  await loadPublic();await loadUser();
  state.page=state.user?.role==='admin'?'admin':'dashboard';render();
  toast('Signed in successfully.','success');
}

async function logout(){
  const {error}=await renderAuthRemoved.signOut();
  if(error)await apiError(error,'Sign out');
  state.user=null;state.borrowings=[];state.favourites=[];state.preferences=[];state.notifications=[];state.activities=[];
  state.page='home';render();
}

/* ---------- catalogue / circulation ---------- */
async function borrow(id){
  if(!state.user){state.page='login';render();return toast('Sign in to borrow a book.','error')}
  if(state.user.status==='suspended')return toast('Your library account is suspended.','error');
  const due=new Date(Date.now()+14*86400000).toISOString().slice(0,10);
  const {error}=await renderRpcRemoved('borrow_book',{p_book_id:id,p_due_date:due});
  if(error){await apiError(error,'Borrow book');return}
  await loadPublic();await loadUser();state.selected=state.books.find(b=>b.id===id);render();toast('Book borrowed successfully.','success');
}

async function returnBook(id){
  const {error}=await renderRpcRemoved('return_book',{p_borrowing_id:id});
  if(error){await apiError(error,'Return book');return}
  await loadPublic();await loadUser();render();toast('Book returned successfully.','success');
}

async function toggleFavorite(id){
  if(!state.user){state.page='login';render();return}
  const exists=state.favourites.includes(id);
  const q=exists
    ? renderDbRemoved.from('favourites').delete().eq('user_id',state.user.id).eq('book_id',id)
    : renderDbRemoved.from('favourites').insert({user_id:state.user.id,book_id:id});
  const {error}=await q;
  if(error){await apiError(error,'Favourite');return}
  await loadUser();render();toast(exists?'Removed from favourites.':'Added to favourites.','success');
}

async function saveProfile(){
  const name=$('pn').value.trim(),email=$('pe').value.trim().toLowerCase();
  if(name.length<2||!/^\S+@\S+\.\S+$/.test(email))return toast('Enter a valid name and email.','error');
  const {error}=await renderDbRemoved.from('profiles').update({full_name:name,email}).eq('id',state.user.id);
  if(error){await apiError(error,'Update profile');return}
  await loadUser();render();toast('Profile updated.','success');
}

async function savePreferences(){
  const ids=[...document.querySelectorAll('.pref-check:checked')].map(x=>x.value);
  const d=await renderDbRemoved.from('user_preferences').delete().eq('user_id',state.user.id);
  if(d.error){await apiError(d.error,'Clear preferences');return}
  if(ids.length){
    const i=await renderDbRemoved.from('user_preferences').insert(ids.map(category_id=>({user_id:state.user.id,category_id})));
    if(i.error){await apiError(i.error,'Save preferences');return}
  }
  await loadUser();render();toast('Reading interests saved.','success');
}

async function changePassword(){
  const p=$('newPassword').value,c=$('confirmPassword').value;
  if(p.length<6)return toast('Password must be at least 6 characters.','error');
  if(p!==c)return toast('Passwords do not match.','error');
  const {error}=await renderAuthRemoved.updateUser({password:p});
  if(error){await apiError(error,'Change password');return}
  $('newPassword').value='';$('confirmPassword').value='';
  toast('Password changed successfully.','success');
}

/* ---------- admin ---------- */
async function saveBook(){
  if(!state.user||state.user.role!=='admin')return toast('Administrator access required.','error');
  const title=$('bt').value.trim(),author=$('ba').value.trim();
  const copies=Math.max(1,Number($('bcopies').value||1));
  const category_id=$('bc').value||null;
  if(!title||!author)return toast('Title and author are required.','error');
  const data={
    title,author,category_id,
    isbn:$('bi').value.trim()||null,
    description:$('bd').value.trim(),
    keywords:$('bk').value.split(',').map(x=>x.trim()).filter(Boolean)
  };
  let result;
  if(state.editingBook){
    const b=state.editingBook;
    const borrowed=(b.total_copies||0)-(b.available_copies||0);
    data.total_copies=Math.max(copies,borrowed);
    data.available_copies=data.total_copies-borrowed;
    result=await renderDbRemoved.from('books').update(data).eq('id',b.id);
  }else{
    data.total_copies=copies;data.available_copies=copies;
    result=await renderDbRemoved.from('books').insert(data);
  }
  if(result.error){await apiError(result.error,'Save book');return}
  state.editingBook=null;await loadPublic();await loadUser();render();toast('Book saved.','success');
}

async function deleteBook(id){
  if(!confirm('Delete this book from the catalogue?'))return;
  const {error}=await renderDbRemoved.from('books').delete().eq('id',id);
  if(error){await apiError(error,'Delete book');return}
  await loadPublic();await loadUser();render();toast('Book deleted.','success');
}

async function toggleMember(id){
  const u=state.users.find(x=>x.id===id);if(!u)return;
  const status=u.status==='active'?'suspended':'active';
  const {error}=await renderDbRemoved.from('profiles').update({status}).eq('id',id);
  if(error){await apiError(error,'Update member');return}
  await loadUser();render();toast(status==='active'?'Member activated.':'Member suspended.','success');
}

/* ---------- UI ---------- */
function header(){
  return `<header class="nav">
    <div class="brand" onclick="go('home')">Royal Library<span>.</span></div>
    <nav class="navlinks">
      <button onclick="go('home')">Home</button><button onclick="go('catalog')">Catalogue</button>
      ${state.user?`<button onclick="go('${state.user.role==='admin'?'admin':'dashboard'}')">${state.user.role==='admin'?'Admin':'My Library'}</button>`:''}
    </nav>
    <div class="nav-search">⌕<input value="${esc(state.query)}" oninput="state.query=this.value;state.page='catalog';render()" placeholder="Search books"></div>
    ${state.user?`<button class="nav-action" onclick="logout()">Logout</button><div>${initials(state.user.name)}</div>`:`<button class="nav-action" onclick="go('login')">Sign in</button><button class="primary" onclick="go('register')">Create account</button>`}
  </header>`;
}

function cover(b){return `<div class="cover">${esc((b.title||'').split(' ').slice(0,2).map(x=>x[0]).join(''))}</div>`}
function card(b){
  const fav=state.favourites.includes(b.id);
  return `<article class="book-card" onclick="details('${b.id}')">${cover(b)}
    <div class="book-info"><span class="category">${esc(b.category)}</span><h3>${esc(b.title)}</h3><p>${esc(b.author)}</p>
    <div class="card-bottom"><span class="${b.availability?'available':'unavailable'}">${b.availability?'Available':'Unavailable'}</span>${state.user?`<button onclick="event.stopPropagation();toggleFavorite('${b.id}')">${fav?'♥':'♡'}</button>`:''}</div></div>
  </article>`;
}

function home(){
  const books=state.books.slice(0,4);
  return `<section class="hero"><div><span class="eyebrow">DIGITAL LIBRARY + PERSONALIZED DISCOVERY</span>
  <h1>Find the next book worth your time.</h1><p>A web-based library management platform for cataloguing, circulation, member accounts and personalized book discovery.</p>
  <div class="actions"><button class="primary" onclick="go('catalog')">Explore catalogue →</button><button class="ghost" onclick="go('login')">Member access</button></div></div>
  <div class="hero-card"><span class="eyebrow">ROYAL LIBRARY</span><h2>Real library data</h2><p style="color:#c3d0c9">Books, members, borrowing and recommendations are connected to your Supabase database.</p>
  <div class="signal">✓ Secure authentication<br>✓ Live catalogue<br>✓ Borrowing and returns<br>✓ Personalized discovery</div></div></section>
  <section class="section"><div class="section-head"><div><span class="eyebrow">CATALOGUE</span><h2>Featured books</h2></div><button class="ghost" onclick="go('catalog')">Browse all →</button></div>
  <div class="book-grid">${books.map(card).join('')||'<div class="panel">No books have been added yet.</div>'}</div></section>`;
}

function catalogue(){
  let books=state.books;
  const q=state.query.trim().toLowerCase();
  if(q)books=books.filter(b=>`${b.title} ${b.author} ${b.category} ${(b.keywords||[]).join(' ')}`.toLowerCase().includes(q));
  if(state.category!=='All')books=books.filter(b=>b.category===state.category);
  return `<section class="page"><div class="page-heading"><div><span class="eyebrow">COLLECTION</span><h1>Catalogue</h1></div><div class="searchbox"><input value="${esc(state.query)}" oninput="state.query=this.value;render()" placeholder="Search title, author, keyword"></div></div>
  <div class="chips"><button class="chip ${state.category==='All'?'active':''}" onclick="state.category='All';render()">All</button>${state.categories.map(c=>`<button class="chip ${state.category===c.name?'active':''}" onclick="state.category='${esc(c.name)}';render()">${esc(c.name)}</button>`).join('')}</div>
  <div class="book-grid">${books.map(card).join('')||'<div class="panel">No books match your search.</div>'}</div></section>`;
}

function details(id){
  state.selected=state.books.find(b=>b.id===id);state.page='details';render();
}
function detail(){
  const b=state.selected;if(!b)return catalogue();
  const loan=state.borrowings.find(x=>x.book_id===b.id&&['borrowed','overdue'].includes(x.status));
  return `<section class="page"><button class="ghost" onclick="go('catalog')">← Back</button><div class="details">${cover(b)}<div><span class="category">${esc(b.category)}</span><h1>${esc(b.title)}</h1><p><b>by ${esc(b.author)}</b></p><p>${esc(b.description||'No description available.')}</p>
  <div class="meta"><div><small>ISBN</small><b>${esc(b.isbn||'—')}</b></div><div><small>Availability</small><b>${b.available_copies}/${b.total_copies}</b></div></div>
  <div class="tags">${(b.keywords||[]).map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div>
  ${state.user&&loan&&loan.user_id===state.user.id?`<button class="primary" onclick="returnBook('${loan.id}')">Return this book</button>`:`<button class="primary" ${b.availability?'':'disabled'} onclick="borrow('${b.id}')">${b.availability?'Borrow this book':'Currently unavailable'}</button>`}
  </div></div></section>`;
}

function login(){
 return `<div class="auth-wrap"><div class="auth"><span class="eyebrow">ROYAL LIBRARY ACCESS</span><h1>Welcome back</h1><p>Sign in to borrow books and manage your library account.</p>
 <label class="field">Email<input id="email" type="email" autocomplete="email"></label><label class="field">Password<input id="password" type="password" autocomplete="current-password"></label>
 <button class="primary full" onclick="loginAction()">Sign in →</button><p style="text-align:center">Don't have an account? <button class="ghost" onclick="go('register')">Create one</button></p></div></div>`;
}

function register(){
 return `<div class="auth-wrap"><div class="auth"><span class="eyebrow">ROYAL LIBRARY MEMBERSHIP</span><h1>Create your account</h1><p>Register as a library member.</p>
 <label class="field">Full name<input id="regName" autocomplete="name"></label><label class="field">Email<input id="regEmail" type="email" autocomplete="email"></label>
 <label class="field">Password<input id="regPassword" type="password" autocomplete="new-password"></label><label class="field">Confirm password<input id="regConfirm" type="password" autocomplete="new-password"></label>
 <button class="primary full" onclick="registerAction()">Create account →</button><p style="text-align:center">Already registered? <button class="ghost" onclick="go('login')">Sign in</button></p></div></div>`;
}

function dashboard(){
 const loans=state.borrowings.filter(x=>x.user_id===state.user.id);
 const active=loans.filter(x=>['borrowed','overdue'].includes(x.status));
 return `<section class="page"><div class="section-head"><div><span class="eyebrow">MY ROYAL LIBRARY</span><h1>Welcome, ${esc(state.user.name)}</h1></div></div>
 <div class="member-nav">${['overview','profile','interests','notifications'].map(x=>`<button class="${state.memberTab===x?'active':''}" onclick="state.memberTab='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>
 ${state.memberTab==='profile'?profileView():state.memberTab==='interests'?interestsView():state.memberTab==='notifications'?notificationsView():memberOverview(active,loans)}</section>`;
}

function memberOverview(active,loans){
 return `<div class="metrics"><div class="metric"><span>Active loans</span><b>${active.length}</b></div><div class="metric"><span>Favourites</span><b>${state.favourites.length}</b></div><div class="metric"><span>History</span><b>${loans.length}</b></div><div class="metric"><span>Notifications</span><b>${state.notifications.filter(x=>!x.is_read).length}</b></div></div>
 <div class="dashboard-grid" style="margin-top:18px"><div class="panel"><h3>Current loans</h3>${active.map(x=>{const b=state.books.find(y=>y.id===x.book_id);return `<div class="loan"><div class="mini">${initials(b?.title)}</div><div><b>${esc(b?.title||'Unknown')}</b><span>Due ${dateOnly(x.due_date)} · ${overdue(x)?'Overdue':'Borrowed'}</span></div><button onclick="returnBook('${x.id}')">Return</button></div>`}).join('')||'<p>No active loans.</p>'}</div>
 <div class="panel"><h3>Recommended for you</h3>${recommendations().slice(0,5).map(b=>`<div class="loan" onclick="details('${b.id}')"><div class="mini">${initials(b.title)}</div><div><b>${esc(b.title)}</b><span>${esc(b.author)} · ${esc(b.category)}</span></div></div>`).join('')||'<p>No recommendations yet.</p>'}</div></div>`;
}

function recommendations(){
 const pref=new Set(state.preferences.map(id=>getCategory(id)));
 const borrowed=new Set(state.borrowings.map(x=>x.book_id));
 return [...state.books].filter(b=>!borrowed.has(b.id)).sort((a,b)=>{
   const pa=pref.has(a.category)?1:0,pb=pref.has(b.category)?1:0;return pb-pa;
 });
}

function profileView(){
 return `<div class="profile-grid"><div class="panel"><h3>Profile</h3><label class="field">Full name<input id="pn" value="${esc(state.user.name)}"></label><label class="field">Email<input id="pe" value="${esc(state.user.email)}"></label><button class="primary" onclick="saveProfile()">Save profile</button></div>
 <div class="panel"><h3>Change password</h3><label class="field">New password<input id="newPassword" type="password"></label><label class="field">Confirm password<input id="confirmPassword" type="password"></label><button class="primary" onclick="changePassword()">Change password</button></div></div>`;
}
function interestsView(){
 return `<div class="panel"><h3>Reading interests</h3><p>Select categories to improve recommendations.</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${state.categories.map(c=>`<label style="padding:10px;background:#f5f6f1;border-radius:9px"><input class="pref-check" type="checkbox" value="${c.id}" ${state.preferences.includes(c.id)?'checked':''}> ${esc(c.name)}</label>`).join('')}</div><button class="primary" style="margin-top:18px" onclick="savePreferences()">Save interests</button></div>`;
}
function notificationsView(){
 return `<div class="panel"><h3>Notifications</h3>${state.notifications.map(n=>`<div class="loan"><div><b>${esc(n.title||'Library notification')}</b><span>${esc(n.message||'')} · ${dateOnly(n.created_at)}</span></div></div>`).join('')||'<p>No notifications.</p>'}</div>`;
}

function adminShell(content){
 return `<div class="admin-shell"><aside class="admin-side">${['overview','books','members','loans','reports'].map(x=>`<button class="${state.adminTab===x?'active':''}" onclick="state.adminTab='${x}';state.editingBook=null;render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</aside><main class="admin-main">${content}</main></div>`;
}
function adminHeader(title,sub){return `<div class="admin-top"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div></div>`}
function adminOverview(){
 const active=state.borrowings.filter(x=>['borrowed','overdue'].includes(x.status)),over=active.filter(overdue);
 return adminShell(adminHeader('Control centre','Manage Royal Library')+`<div class="admin-card-grid"><div class="admin-stat"><small>Total titles</small><strong>${state.books.length}</strong></div><div class="admin-stat"><small>Members</small><strong>${state.users.filter(x=>x.role==='member').length}</strong></div><div class="admin-stat"><small>Active loans</small><strong>${active.length}</strong></div><div class="admin-stat"><small>Overdue</small><strong>${over.length}</strong></div></div><div class="admin-cols"><div class="panel"><h3>Recent borrowing</h3>${state.borrowings.slice(0,8).map(x=>{const b=state.books.find(y=>y.id===x.book_id),u=state.users.find(y=>y.id===x.user_id);return `<div class="loan"><div class="mini">${initials(b?.title)}</div><div><b>${esc(b?.title||'Unknown')}</b><span>${esc(u?.full_name||'Unknown')} · ${esc(x.status)}</span></div></div>`}).join('')||'<p>No borrowing activity.</p>'}</div><div class="panel"><h3>Catalogue</h3><p>${state.books.length} titles and ${state.books.reduce((n,b)=>n+(b.total_copies||0),0)} total copies.</p><button class="primary" onclick="state.adminTab='books';render()">Manage books</button></div></div>`);
}
function bookForm(){
 const b=state.editingBook||{};
 return `<div class="panel" style="margin-bottom:18px"><h3>${state.editingBook?'Edit book':'Add book'}</h3><div class="form-grid">
 <label class="field">Title<input id="bt" value="${esc(b.title||'')}"></label><label class="field">Author<input id="ba" value="${esc(b.author||'')}"></label>
 <label class="field">Category<select id="bc"><option value="">Uncategorized</option>${state.categories.map(c=>`<option value="${c.id}" ${b.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
 <label class="field">Copies<input id="bcopies" type="number" min="1" value="${b.total_copies||1}"></label>
 <label class="field">ISBN<input id="bi" value="${esc(b.isbn||'')}"></label><label class="field">Keywords<input id="bk" value="${esc((b.keywords||[]).join(', '))}"></label>
 <label class="field wide">Description<textarea id="bd" rows="3">${esc(b.description||'')}</textarea></label></div>
 <button class="primary" onclick="saveBook()">Save book</button> ${state.editingBook?'<button class="ghost" onclick="state.editingBook=null;render()">Cancel</button>':''}</div>`;
}
function adminBooks(){
 return adminShell(adminHeader('Books','Manage catalogue records and copies')+bookForm()+`<div class="panel"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Book</th><th>Category</th><th>Copies</th><th>Action</th></tr></thead><tbody>${state.books.map(b=>`<tr><td><b>${esc(b.title)}</b><br>${esc(b.author)}</td><td>${esc(b.category)}</td><td>${b.available_copies}/${b.total_copies}</td><td><button class="admin-btn" onclick="state.editingBook=state.books.find(x=>x.id==='${b.id}');render()">Edit</button> <button class="admin-btn danger" onclick="deleteBook('${b.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="4">No books.</td></tr>'}</tbody></table></div></div>`);
}
function adminMembers(){
 return adminShell(adminHeader('Members','Manage registered library members')+`<div class="panel"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.users.filter(u=>u.role==='member').map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.email||'')}</td><td><span class="status-pill ${u.status==='active'?'status-green':'status-red'}">${esc(u.status)}</span></td><td><button class="admin-btn" onclick="toggleMember('${u.id}')">${u.status==='active'?'Suspend':'Activate'}</button></td></tr>`).join('')||'<tr><td colspan="4">No members.</td></tr>'}</tbody></table></div></div>`);
}
function adminLoans(){
 return adminShell(adminHeader('Borrowing & returns','Monitor circulation and due dates')+`<div class="panel"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Member</th><th>Book</th><th>Borrowed</th><th>Due</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.borrowings.map(x=>{const b=state.books.find(y=>y.id===x.book_id),u=state.users.find(y=>y.id===x.user_id);return `<tr><td>${esc(u?.full_name||'Unknown')}</td><td>${esc(b?.title||'Unknown')}</td><td>${dateOnly(x.borrow_date)}</td><td>${dateOnly(x.due_date)}</td><td>${esc(x.status)}</td><td>${['borrowed','overdue'].includes(x.status)?`<button class="admin-btn" onclick="returnBook('${x.id}')">Return</button>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="6">No transactions.</td></tr>'}</tbody></table></div></div>`);
}
function adminReports(){
 const total=state.borrowings.length,returned=state.borrowings.filter(x=>x.status==='returned').length;
 return adminShell(adminHeader('Reports & analytics','Circulation summary')+`<div class="admin-card-grid"><div class="admin-stat"><small>Titles</small><strong>${state.books.length}</strong></div><div class="admin-stat"><small>Transactions</small><strong>${total}</strong></div><div class="admin-stat"><small>Returned</small><strong>${returned}</strong></div><div class="admin-stat"><small>Return rate</small><strong>${total?Math.round(returned/total*100):0}%</strong></div></div><div class="panel"><h3>Audit log</h3>${state.audit.map(a=>`<div class="loan"><div><b>${esc(a.action||'Activity')}</b><span>${esc(JSON.stringify(a.details||{}))} · ${dateOnly(a.created_at)}</span></div></div>`).join('')||'<p>No administrative activity.</p>'}</div>`);
}
function admin(){return state.adminTab==='books'?adminBooks():state.adminTab==='members'?adminMembers():state.adminTab==='loans'?adminLoans():state.adminTab==='reports'?adminReports():adminOverview()}

function go(page){state.page=page;render()}
function render(){
 let content='';
 if(state.page==='home')content=home();
 else if(state.page==='catalog')content=catalogue();
 else if(state.page==='details')content=detail();
 else if(state.page==='login')content=login();
 else if(state.page==='register')content=register();
 else if(state.page==='dashboard')content=state.user?dashboard():login();
 else if(state.page==='admin')content=state.user?.role==='admin'?admin():login();
 document.getElementById('app').innerHTML=header()+content+`<footer class="footer">Royal Library — Digital Library Management & Personalized Book Recommendation System</footer>`+(state.toast?`<div class="toast">${esc(state.toast.message)}</div>`:'');
}

/* ---------- connection diagnostics ---------- */
async function diagnose(){
 console.log('Royal Library Supabase configuration:',{url:SUPABASE_URL,keyPresent:!!SUPABASE_KEY});
 try{
   const {data,error}=await renderAuthRemoved.getSession();
   console.log('Supabase auth test:',{data,error});
 }catch(e){console.error('SUPABASE NETWORK ERROR:',e)}
}

renderAuthRemoved.onAuthStateChange(async()=>{await loadPublic();await loadUser();render()});

(async function boot(){
 try{
   const ok=await loadPublic();
   if(ok)await loadUser();
 }catch(e){console.error('BOOT ERROR',e)}
 render();
 diagnose();
})();
</script>
</body>
</html>
