{id:'b9',title:'Designing Data-Intensive Applications',author:'Martin Kleppmann',category:'Computer Science',isbn:'9781449373320',description:'Architecture and engineering principles for reliable data systems.',keywords:['data','distributed systems','architecture'],availability:true},
{id:'b10',title:'The Psychology of Money',author:'Morgan Housel',category:'Business',isbn:'9780857197689',description:'Lessons about behaviour, risk, and decision-making with money.',keywords:['finance','psychology','business'],availability:true},
{id:'b11',title:'The Psychology Book',author:'DK',category:'Psychology',isbn:'9780241401782',description:'An accessible introduction to major ideas and thinkers in psychology.',keywords:['psychology','behaviour','mind'],availability:true},
{id:'b12',title:'The Alchemist',author:'Paulo Coelho',category:'Fiction',isbn:'9780062315007',description:'A philosophical novel about purpose, journey, and self-discovery.',keywords:['fiction','philosophy','journey'],availability:true}
];
const seedUsers=[{id:'u1',name:'Aisha Bello',email:'aisha@example.com',password:'member123',role:'member'},{id:'u2',name:'Musa Ibrahim',email:'musa@example.com',password:'member123',role:'member'},{id:'u3',name:'Royal Library Admin',email:'admin@library.local',password:'admin123',role:'admin'}];
let state={books:load('libra_books',seedBooks),users:load('libra_users',seedUsers),borrowing:load('libra_borrowing',[]),user:load('libra_user',null),page:'home',query:'',category:'All',selected:null,toast:'',adminTab:'overview',editingBook:null};
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}} function save(){localStorage.setItem('libra_books',JSON.stringify(state.books));localStorage.setItem('libra_users',JSON.stringify(state.users));localStorage.setItem('libra_borrowing',JSON.stringify(state.borrowing));localStorage.setItem('libra_user',JSON.stringify(state.user))}
function toast(m){state.toast=m;render();setTimeout(()=>{state.toast='';render()},2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function cls(c){return c==='Computer Science'?'':' '+({'Literature':'blue','Business':'gold','Psychology':'red','Fiction':'blue','Personal Development':'gold'}[c]||'')}
function cover(b){return `<div class="cover${cls(b.category)}">${esc(b.title.split(' ').slice(0,2).map(x=>x[0]).join(''))}</div>`}
function header(){return `<header class="nav"><div class="brand" onclick="go('home')">Royal Library<span>.</span></div><nav class="navlinks"><button class="${state.page==='home'?'active':''}" onclick="go('home')">Home</button><button class="${state.page==='catalog'?'active':''}" onclick="go('catalog')">Catalogue</button>${state.user?`<button onclick="go('${state.user.role==='admin'?'admin':'dashboard'}')">${state.user.role==='admin'?'Admin':'My Royal Library'}</button>`:''}</nav><div class="nav-search">⌕<input value="${esc(state.query)}" oninput="state.query=this.value;state.page='catalog';render()" placeholder="Search books"></div>${state.user?`<button class="nav-action" onclick="logout()">Logout</button><div class="avatar">${esc(state.user.name[0])}</div>`:`<button class="nav-action" onclick="go('login')">Sign in</button><button class="primary" style="padding:9px 13px" onclick="go('register')">Create account</button>`}</header>`}
function card(b){return `<article class="book-card" onclick="details('${b.id}')">${cover(b)}<div class="book-info"><span class="category">${esc(b.category)}</span><h3>${esc(b.title)}</h3><p>${esc(b.author)}</p><div class="card-bottom"><span class="${b.availability?'available':'unavailable'}">${b.availability?'Available':'Borrowed'}</span><button>Details →</button></div></div></article>`}
function home(){let rec=recommendations();return `<section class="hero"><div><span class="eyebrow">DIGITAL LIBRARY + PERSONALIZED DISCOVERY</span><h1>Find the next book worth your time.</h1><p>A web-based library management platform for cataloguing, circulation, member accounts, and personalized book discovery.</p><div class="actions"><button class="primary" onclick="go('catalog')">Explore catalogue →</button><button class="ghost" onclick="go('login')">Member access</button></div></div><div class="hero-card"><div class="hero-card-top"><span>PERSONALIZED FOR YOU</span><span>ROYAL LIBRARY ENGINE</span></div><div class="feature">${cover(seedBooks[0])}<div><span>Computer Science</span><h2>Clean Code</h2><p>Robert C. Martin</p></div></div><div class="signal"><span class="dot"></span>Recommendations use catalogue attributes and borrowing activity.</div></div></section><section class="section"><div class="section-head"><div><span class="eyebrow">DISCOVERY</span><h2>Recommended for you</h2></div><button class="text-btn" onclick="go('catalog')">Browse all →</button></div><div class="book-grid">${rec.slice(0,4).map(card).join('')}</div></section><section class="section split"><div><span class="eyebrow">SYSTEM ARCHITECTURE</span><h2>One library. Three layers.</h2><p>The project architecture connects a central data layer, the web application, and a recommendation layer. Borrowing and catalogue activity becomes useful discovery data.</p></div><div class="layers"><div class="layer"><span>01</span><b>Data Layer</b><small>Users, books, categories, borrowing and activity.</small></div><div class="layer"><span>02</span><b>Application Layer</b><small>Authentication, search, circulation, dashboards and reports.</small></div><div class="layer"><span>03</span><b>Recommendation Layer</b><small>Content-based + collaborative filtering principles.</small></div></div></section>`}
function catalogue(){let cats=['All',...new Set(state.books.map(b=>b.category))];let books=state.books.filter(b=>(state.category==='All'||b.category===state.category)&&(`${b.title} ${b.author} ${b.category} ${b.keywords.join(' ')}`.toLowerCase().includes(state.query.toLowerCase())));return `<section class="page"><div class="page-heading"><div><span class="eyebrow">CATALOGUE</span><h1>Explore the collection</h1><p>Search by title, author, category, or keyword.</p></div><div class="searchbox">⌕ <input value="${esc(state.query)}" oninput="state.query=this.value;render()" placeholder="Search the catalogue..."></div></div><div class="chips">${cats.map(c=>`<button class="chip ${state.category===c?'active':''}" onclick="state.category='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div><p>${books.length} book${books.length!==1?'s':''} found</p><div class="book-grid">${books.map(card).join('')}</div>${!books.length?'<div class="empty"><h3>No books match that search.</h3><p>Try another title, author, category, or keyword.</p></div>':''}</section>`}
function details(id){state.selected=state.books.find(b=>b.id===id);state.page='details';render()}
function detail(){let b=state.selected;if(!b)return catalogue();let related=state.books.filter(x=>x.id!==b.id&&x.category===b.category).slice(0,4);return `<section class="page"><button class="back" onclick="go('catalog')">← Back to catalogue</button><div class="details">${cover(b)}<div><span class="category">${esc(b.category)}</span><h1>${esc(b.title)}</h1><p class="author">by ${esc(b.author)}</p><p>${esc(b.description)}</p><div class="meta"><div><small>ISBN</small><b>${esc(b.isbn)}</b></div><div><small>Availability</small><b>${b.availability?'Available to borrow':'Currently borrowed'}</b></div></div><div class="tags">${b.keywords.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div><button class="primary" ${b.availability?'':'disabled'} onclick="borrow('${b.id}')">${b.availability?'Borrow this book':'Currently unavailable'} →</button></div></div><div class="section-head"><div><span class="eyebrow">MORE LIKE THIS</span><h2>Related books</h2></div></div><div class="book-grid">${related.map(card).join('')}</div></section>`}
function login(){return `<div class="auth-wrap"><div class="auth"><span class="eyebrow">ROYAL LIBRARY ACCESS</span><h1>Welcome back</h1><p>Sign in to borrow books, view your history, and receive personalized recommendations.</p><label class="field">Email<input id="email" type="email" placeholder="you@example.com"></label><label class="field">Password<input id="password" type="password" placeholder="Enter your password"></label><button class="primary full" onclick="loginAction()">Sign in →</button><p style="text-align:center;margin:18px 0 0">Don't have an account? <button class="text-btn" onclick="go('register')">Create one</button></p><div class="demo"><b>Demo accounts</b><br>Member: aisha@example.com / member123<br>Admin: admin@library.local / admin123</div></div></div>`}
function loginAction(){let email=document.getElementById('email').value.trim().toLowerCase();let password=document.getElementById('password').value;if(!email||!password){toast('Enter your email and password.');return}let u=state.users.find(x=>x.email.toLowerCase()===email);if(!u){toast('No account found with that email. Create an account first.');return}if(!u.password){u.password='member123';}if(u.password!==password){toast('Incorrect password.');return}state.user=u;save();state.page=u.role==='admin'?'admin':'dashboard';toast('Signed in successfully.')}
function register(){return `<div class="auth-wrap"><div class="auth"><span class="eyebrow">ROYAL LIBRARY MEMBERSHIP</span><h1>Create your account</h1><p>Register as a library member to borrow books, track your reading history, and receive personalized recommendations.</p><label class="field">Full name<input id="regName" type="text" placeholder="Your full name"></label><label class="field">Email address<input id="regEmail" type="email" placeholder="you@example.com"></label><label class="field">Password<input id="regPassword" type="password" placeholder="At least 6 characters"></label><label class="field">Confirm password<input id="regConfirm" type="password" placeholder="Repeat your password"></label><button class="primary full" onclick="registerAction()">Create account →</button><p style="text-align:center;margin:18px 0 0">Already have an account? <button class="text-btn" onclick="go('login')">Sign in</button></p></div></div>`}
function registerAction(){let name=document.getElementById('regName').value.trim();let email=document.getElementById('regEmail').value.trim().toLowerCase();let password=document.getElementById('regPassword').value;let confirm=document.getElementById('regConfirm').value;if(name.length<2){toast('Enter your full name.');return}if(!/^\S+@\S+\.\S+$/.test(email)){toast('Enter a valid email address.');return}if(password.length<6){toast('Password must be at least 6 characters.');return}if(password!==confirm){toast('Passwords do not match.');return}if(state.users.some(x=>x.email.toLowerCase()===email)){toast('An account with this email already exists.');return}let u={id:'u'+Date.now(),name,email,password,role:'member',created_at:new Date().toISOString().slice(0,10)};state.users.push(u);state.user=u;save();state.page='dashboard';toast('Account created successfully.')}
function logout(){state.user=null;save();state.page='home';render()}
function borrow(id){if(!state.user){toast('Sign in to borrow a book.');go('login');return}let b=state.books.find(x=>x.id===id);if(!b||!b.availability){toast('This book is unavailable.');return}let now=new Date();let due=new Date(now.getTime()+14*86400000);state.borrowing.push({id:'br'+Date.now(),user_id:state.user.id,book_id:id,borrow_date:now.toISOString().slice(0,10),due_date:due.toISOString().slice(0,10),return_date:null,status:'borrowed'});b.availability=false;save();toast('Book borrowed. Due in 14 days.');render()}
function ret(id){let br=state.borrowing.find(x=>x.id===id);if(!br)return;br.status='returned';br.return_date=new Date().toISOString().slice(0,10);let b=state.books.find(x=>x.id===br.book_id);if(b)b.availability=true;save();toast('Book returned.');render()}
function recommendations(){let uid=state.user?.id||'u1';let mine=state.borrowing.filter(x=>x.user_id===uid);let cats=mine.map(x=>state.books.find(b=>b.id===x.book_id)?.category).filter(Boolean);let keys=mine.flatMap(x=>state.books.find(b=>b.id===x.book_id)?.keywords||[]);let seen=new Set(mine.map(x=>x.book_id));return state.books.filter(b=>!seen.has(b.id)).map(b=>({...b,score:(cats.includes(b.category)?4:0)+(b.keywords||[]).filter(k=>keys.includes(k)).length*2})).sort((a,b)=>b.score-a.score)}
function dashboard(){let bs=state.borrowing.filter(x=>x.user_id===state.user.id);let rec=recommendations();return `<section class="page"><div class="dash-head"><div><span class="eyebrow">MY ROYAL LIBRARYRY</span><h1>Good to see you, ${esc(state.user.name.split(' ')[0])}.</h1><p>Your borrowing activity and personalized discovery in one view.</p></div></div><div class="metrics"><div class="metric"><span>Current loans</span><b>${bs.filter(x=>x.status==='borrowed').length}</b></div><div class="metric"><span>Returned</span><b>${bs.filter(x=>x.status==='returned').length}</b></div><div class="metric"><span>Recommendations</span><b>${rec.length}</b></div><div class="metric"><span>Role</span><b>Member</b></div></div><div class="dashboard-grid"><div class="panel"><div class="panel-head"><h3>Current & recent borrowing</h3></div>${bs.length?bs.map(x=>{let b=state.books.find(y=>y.id===x.book_id);return `<div class="loan"><div class="mini">${esc(b?.title.slice(0,2).toUpperCase())}</div><div><b>${esc(b?.title||'Unknown')}</b><span>${x.status==='borrowed'?'Due '+x.due_date:'Returned '+x.return_date}</span></div>${x.status==='borrowed'?`<button onclick="ret('${x.id}')">Return</button>`:''}</div>`}).join(''):'<div class="empty"><p>No borrowing history yet.</p></div>'}</div><div class="panel"><div class="panel-head"><h3>Personalized recommendations</h3><span>Hybrid</span></div>${rec.slice(0,6).map(b=>`<div class="rec" onclick="details('${b.id}')"><div class="mini">${esc(b.title.slice(0,2).toUpperCase())}</div><div><b>${esc(b.title)}</b><span>${esc(b.author)}</span></div><strong>${b.score}</strong></div>`).join('')}</div></div></section>`}
function adminNav(){return `<aside class="admin-side"><div class="side-title"><b>ROYAL LIBRARY ADMIN</b><small>Royal Library management</small></div>${[['overview','▦','Overview'],['books','▤','Books'],['members','♙','Members'],['loans','↔','Borrowing'],['reports','◒','Reports']].map(([k,i,l])=>`<button class="${state.adminTab===k?'active':''}" onclick="adminTab('${k}')">${i} &nbsp; ${l}</button>`).join('')}<button onclick="go('catalog')">← View catalogue</button></aside>`}
function adminTab(t){state.adminTab=t;state.editingBook=null;render();scrollTo(0,0)}
function adminShell(content){return `<div class="admin-shell">${adminNav()}<main class="admin-main">${content}</main></div>`}
function adminHeader(title,sub,action=''){return `<div class="admin-top"><div><span class="eyebrow">ADMINISTRATION</span><h1>${title}</h1><p>${sub}</p></div>${action?`<div class="admin-actions">${action}</div>`:''}</div>`}
function adminOverview(){let active=state.borrowing.filter(x=>x.status==='borrowed');let overdue=active.filter(x=>new Date(x.due_date)<new Date());let popular=state.books.map(b=>({...b,count:state.borrowing.filter(x=>x.book_id===b.id).length})).sort((a,b)=>b.count-a.count).slice(0,5);return adminShell(`${adminHeader('Royal Library control centre','Monitor the collection, members, circulation and system activity.')}
<div class="admin-card-grid"><div class="admin-stat"><div class="icon">▤</div><small>Total books</small><strong>${state.books.length}</strong></div><div class="admin-stat"><div class="icon">♙</div><small>Members</small><strong>${state.users.filter(x=>x.role==='member').length}</strong></div><div class="admin-stat"><div class="icon">↔</div><small>Active loans</small><strong>${active.length}</strong></div><div class="admin-stat"><div class="icon">!</div><small>Overdue</small><strong>${overdue.length}</strong></div></div>
<div class="admin-cols"><div class="panel"><div class="panel-head"><h3>Recent borrowing</h3><button class="admin-btn" onclick="adminTab('loans')">View all</button></div>${active.slice().reverse().slice(0,7).map(x=>{let b=state.books.find(y=>y.id===x.book_id),u=state.users.find(y=>y.id===x.user_id);let od=new Date(x.due_date)<new Date();return `<div class="loan"><div class="mini">${esc((b?.title||'?').slice(0,2).toUpperCase())}</div><div><b>${esc(b?.title||'Unknown')}</b><span>${esc(u?.name||'Unknown member')} · Due ${x.due_date}</span></div><span class="status-pill ${od?'status-red':'status-green'}">${od?'Overdue':'Active'}</span></div>`}).join('')||'<div class="admin-empty">No active borrowing records.</div>'}</div><div class="panel"><div class="panel-head"><h3>Most borrowed</h3></div><div class="report-bars">${popular.map(b=>{let max=Math.max(1,popular[0]?.count||1);return `<div class="report-bar"><label><span>${esc(b.title)}</span><span>${b.count}</span></label><div class="bar-track"><div class="bar-fill" style="width:${Math.max(5,b.count/max*100)}%"></div></div></div>`}).join('')}</div></div></div>
<div class="panel" style="margin-top:18px"><div class="panel-head"><h3>Quick actions</h3></div><div class="quick-grid"><button class="quick" onclick="adminTab('books')"><b>Manage books</b><span>Add, edit or remove catalogue records.</span></button><button class="quick" onclick="adminTab('members')"><b>Manage members</b><span>Review registered library users.</span></button><button class="quick" onclick="adminTab('reports')"><b>View reports</b><span>Borrowing and catalogue statistics.</span></button></div></div>`)}
function bookForm(){let b=state.editingBook;return `<div class="admin-form"><div class="panel-head"><h3>${b?'Edit book':'Add new book'}</h3>${b?`<button class="admin-btn" onclick="state.editingBook=null;render()">Cancel</button>`:''}</div><div class="form-grid"><label class="field">Title<input id="bt" value="${esc(b?.title||'')}"></label><label class="field">Author<input id="ba" value="${esc(b?.author||'')}"></label><label class="field">Category<select id="bc">${['Computer Science','Literature','Personal Development','Business','Psychology','Fiction'].map(c=>`<option ${b?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">ISBN<input id="bi" value="${esc(b?.isbn||'')}"></label><label class="field wide">Description<textarea id="bd">${esc(b?.description||'')}</textarea></label><label class="field wide">Keywords<input id="bk" value="${esc((b?.keywords||[]).join(', '))}" placeholder="programming, software, systems"></label></div><button class="primary" onclick="saveBook()">${b?'Save changes':'Add book'} →</button></div>`}
function adminBooks(){return adminShell(`${adminHeader('Books','Manage catalogue records, availability and book information.',`<button class="primary" onclick="state.editingBook=null;document.getElementById('book-form-anchor')?.scrollIntoView();render()">+ Add book</button>`)}<div id="book-form-anchor"></div>${bookForm()}<div class="panel"><div class="panel-head"><h3>Catalogue inventory</h3><span>${state.books.length} records</span></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Book</th><th>Category</th><th>ISBN</th><th>Status</th><th>Actions</th></tr></thead><tbody>${state.books.map(b=>`<tr><td><b>${esc(b.title)}</b><br><span>${esc(b.author)}</span></td><td>${esc(b.category)}</td><td>${esc(b.isbn||'—')}</td><td><span class="status-pill ${b.availability?'status-green':'status-red'}">${b.availability?'Available':'Borrowed'}</span></td><td><button class="admin-btn" onclick="editBook('${b.id}')">Edit</button> <button class="admin-btn danger" onclick="deleteBook('${b.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`)}
function editBook(id){state.editingBook=state.books.find(b=>b.id===id)||null;state.adminTab='books';render()}
function saveBook(){let title=document.getElementById('bt').value.trim(),author=document.getElementById('ba').value.trim();if(!title||!author){toast('Title and author are required.');return}let data={title,author,category:document.getElementById('bc').value,isbn:document.getElementById('bi').value.trim(),description:document.getElementById('bd').value.trim(),keywords:document.getElementById('bk').value.split(',').map(x=>x.trim()).filter(Boolean)};if(state.editingBook){Object.assign(state.editingBook,data);toast('Book updated.')}else{state.books.unshift({id:'b'+Date.now(),...data,availability:true});toast('Book added.')}state.editingBook=null;save();render()}
function deleteBook(id){let b=state.books.find(x=>x.id===id);if(!b)return;if(state.borrowing.some(x=>x.book_id===id&&x.status==='borrowed')){toast('Return the book before deleting it.');return}if(!confirm(`Delete "${b.title}" from the catalogue?`))return;state.books=state.books.filter(x=>x.id!==id);save();toast('Book deleted.');render()}
function adminMembers(){let members=state.users.filter(x=>x.role==='member');return adminShell(`${adminHeader('Members','Review registered library members and their borrowing activity.') }<div class="panel"><div class="panel-head"><h3>Registered members</h3><span>${members.length} members</span></div><div class="admin-list">${members.map(u=>{let loans=state.borrowing.filter(x=>x.user_id===u.id),active=loans.filter(x=>x.status==='borrowed').length;return `<div class="member-row"><div class="member-avatar">${esc(u.name[0]||'?')}</div><div class="grow"><b>${esc(u.name)}</b><small>${esc(u.email)}</small></div><span>${active} active loan${active!==1?'s':''}</span><button class="admin-btn danger" onclick="removeMember('${u.id}')">Remove</button></div>`}).join('')||'<div class="admin-empty">No registered members.</div>'}</div></div>`)}
function removeMember(id){let u=state.users.find(x=>x.id===id);if(!u)return;if(state.borrowing.some(x=>x.user_id===id&&x.status==='borrowed')){toast('This member has an active loan.');return}if(!confirm(`Remove ${u.name} from the member list?`))return;state.users=state.users.filter(x=>x.id!==id);save();toast('Member removed.');render()}
function adminLoans(){let rows=state.borrowing.slice().reverse();return adminShell(`${adminHeader('Borrowing & returns','Monitor circulation, due dates and overdue books.') }<div class="metrics"><div class="metric"><span>Total transactions</span><b>${state.borrowing.length}</b></div><div class="metric"><span>Active</span><b>${state.borrowing.filter(x=>x.status==='borrowed').length}</b></div><div class="metric"><span>Returned</span><b>${state.borrowing.filter(x=>x.status==='returned').length}</b></div><div class="metric"><span>Overdue</span><b>${state.borrowing.filter(x=>x.status==='borrowed'&&new Date(x.due_date)<new Date()).length}</b></div></div><div class="panel"><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Member</th><th>Book</th><th>Borrowed</th><th>Due</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(x=>{let u=state.users.find(y=>y.id===x.user_id),b=state.books.find(y=>y.id===x.book_id),over=x.status==='borrowed'&&new Date(x.due_date)<new Date();return `<tr><td>${esc(u?.name||'Unknown')}</td><td>${esc(b?.title||'Unknown')}</td><td>${x.borrow_date}</td><td>${x.due_date}</td><td><span class="status-pill ${x.status==='returned'?'status-green':over?'status-red':'status-gold'}">${x.status==='returned'?'Returned':over?'Overdue':'Borrowed'}</span></td><td>${x.status==='borrowed'?`<button class="admin-btn" onclick="adminReturn('${x.id}')">Mark returned</button>`:'—'}</td></tr>`}).join('')}</tbody></table></div></div>`)}
function adminReturn(id){ret(id);state.adminTab='loans';render()}
function adminReports(){let total=state.borrowing.length,returned=state.borrowing.filter(x=>x.status==='returned').length,active=total-returned;let cats=[...new Set(state.books.map(b=>b.category))].map(c=>({c,n:state.books.filter(b=>b.category===c).length})).sort((a,b)=>b.n-a.n);return adminShell(`${adminHeader('Reports & analytics','Basic reports for collection and circulation management.') }<div class="admin-card-grid"><div class="admin-stat"><small>Catalogue size</small><strong>${state.books.length}</strong></div><div class="admin-stat"><small>Transactions</small><strong>${total}</strong></div><div class="admin-stat"><small>Return rate</small><strong>${total?Math.round(returned/total*100):0}%</strong></div><div class="admin-stat"><small>Availability</small><strong>${state.books.length?Math.round(state.books.filter(b=>b.availability).length/state.books.length*100):0}%</strong></div></div><div class="admin-cols"><div class="panel"><div class="panel-head"><h3>Books by category</h3></div><div class="report-bars">${cats.map(x=>{let max=Math.max(1,cats[0]?.n||1);return `<div class="report-bar"><label><span>${esc(x.c)}</span><span>${x.n}</span></label><div class="bar-track"><div class="bar-fill" style="width:${x.n/max*100}%"></div></div></div>`}).join('')}</div></div><div class="panel"><div class="panel-head"><h3>Circulation summary</h3></div><div class="loan"><div class="mini">A</div><div><b>Active loans</b><span>Books currently out</span></div><strong>${active}</strong></div><div class="loan"><div class="mini">R</div><div><b>Returned</b><span>Completed transactions</span></div><strong>${returned}</strong></div><div class="loan"><div class="mini">O</div><div><b>Overdue</b><span>Past due date</span></div><strong>${state.borrowing.filter(x=>x.status==='borrowed'&&new Date(x.due_date)<new Date()).length}</strong></div></div></div>`)}
function admin(){if(state.adminTab==='books')return adminBooks();if(state.adminTab==='members')return adminMembers();if(state.adminTab==='loans')return adminLoans();if(state.adminTab==='reports')return adminReports();return adminOverview()}

function addBook(){let title=document.getElementById('bt').value.trim(),author=document.getElementById('ba').value.trim();if(!title||!author){toast('Title and author are required.');return}state.books.unshift({id:'b'+Date.now(),title,author,category:document.getElementById('bc').value,isbn:document.getElementById('bi').value.trim(),description:document.getElementById('bd').value.trim(),keywords:document.getElementById('bk').value.split(',').map(x=>x.trim()).filter(Boolean),availability:true});save();toast('Book added.');render()}
function go(p){state.page=p;render();scrollTo(0,0)}
function render(){let body=state.page==='home'?home():state.page==='catalog'?catalogue():state.page==='details'?detail():state.page==='login'?login():state.page==='register'?register():state.page==='dashboard'&&state.user?dashboard():state.page==='admin'&&state.user?.role==='admin'?admin():home();document.getElementById('app').innerHTML=header()+body+`<footer class="footer">Digital Royal Library Management & Personalized Book Recommendation System</footer>${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}`}

/* ===== Completed prototype layer ===== */
function normalizeState(){
  state.books.forEach(b=>{b.total_copies=Number(b.total_copies||3);b.available_copies=Number.isFinite(Number(b.available_copies))?Number(b.available_copies):(b.availability?b.total_copies:0);b.keywords=Array.isArray(b.keywords)?b.keywords:[];});
  state.users.forEach(u=>{u.favorite_ids=Array.isArray(u.favorite_ids)?u.favorite_ids:[];u.preferences=Array.isArray(u.preferences)?u.preferences:[];u.active=u.active!==false;u.created_at=u.created_at||new Date().toISOString().slice(0,10)});
  state.activities=load('libra_activities',[]);state.audit=load('libra_audit',[]);state.memberTab=state.memberTab||'overview';state.catalogPage=state.catalogPage||1;state.sort=state.sort||'title';state.availabilityFilter=state.availabilityFilter||'all';
}
normalizeState();
function save(){localStorage.setItem('libra_books',JSON.stringify(state.books));localStorage.setItem('libra_users',JSON.stringify(state.users));localStorage.setItem('libra_borrowing',JSON.stringify(state.borrowing));localStorage.setItem('libra_user',JSON.stringify(state.user));localStorage.setItem('libra_activities',JSON.stringify(state.activities||[]));localStorage.setItem('libra_audit',JSON.stringify(state.audit||[]))}
function currentUser(){return state.users.find(u=>u.id===state.user?.id)||state.user}
function logActivity(type,bookId){state.activities.push({id:'a'+Date.now()+Math.random(),user_id:state.user?.id||null,book_id:bookId,type,date:new Date().toISOString()});save()}
function audit(action,details){state.audit.unshift({id:'ad'+Date.now()+Math.random(),action,details,date:new Date().toISOString(),admin_id:state.user?.id||null});state.audit=state.audit.slice(0,100);save()}
function overdue(x){return x.status==='borrowed'&&new Date(x.due_date+'T23:59:59')<new Date()}
function dueSoon(x){let d=(new Date(x.due_date+'T23:59:59')-new Date())/86400000;return x.status==='borrowed'&&d>=0&&d<=3}
function statusLabel(x){return x.status==='returned'?'Returned':overdue(x)?'Overdue':dueSoon(x)?'Due soon':'Borrowed'}
function statusClass(x){return x.status==='returned'?'status-green':overdue(x)?'status-red':dueSoon(x)?'status-gold':'status-green'}
function isFav(id){return !!state.user?.favorite_ids?.includes(id)}
function toggleFavorite(id){if(!state.user){toast('Sign in to save favourites.');go('login');return}let u=currentUser();u.favorite_ids=u.favorite_ids||[];u.favorite_ids=u.favorite_ids.includes(id)?u.favorite_ids.filter(x=>x!==id):[...u.favorite_ids,id];state.user=u;save();render()}
function addActivity(type,id){if(state.user)logActivity(type,id)}
function recommendations(){
 let u=currentUser();let uid=u?.id;let mine=state.borrowing.filter(x=>x.user_id===uid);let prefs=u?.preferences||[];let seen=new Set(mine.map(x=>x.book_id));let cats=mine.map(x=>state.books.find(b=>b.id===x.book_id)?.category).filter(Boolean);let keys=mine.flatMap(x=>state.books.find(b=>b.id===x.book_id)?.keywords||[]);let peerCounts={};mine.forEach(m=>{state.borrowing.filter(x=>x.book_id===m.book_id&&x.user_id!==uid).forEach(peer=>{state.borrowing.filter(x=>x.user_id===peer.user_id&&x.status==='returned').forEach(px=>{peerCounts[px.book_id]=(peerCounts[px.book_id]||0)+1})})});
 return state.books.filter(b=>!seen.has(b.id)&&b.available_copies>0).map(b=>{let content=(cats.includes(b.category)?4:0)+(prefs.includes(b.category)?5:0)+(b.keywords||[]).filter(k=>keys.includes(k)).length*2;let coll=(peerCounts[b.id]||0)*2;let score=content+coll;let reason=prefs.includes(b.category)?'Matches your selected interests':cats.includes(b.category)?'Similar to books you borrowed':coll?'Borrowed by readers with similar activity':'Popular catalogue match';return {...b,score,reason}}).sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title))}
function card(b){return `<article class="book-card" onclick="details('${b.id}')">${cover(b)}<div class="book-info"><span class="category">${esc(b.category)}</span><h3>${esc(b.title)}</h3><p>${esc(b.author)}</p><div class="card-bottom"><span class="${b.available_copies>0?'available':'unavailable'}">${b.available_copies>0?`${b.available_copies}/${b.total_copies} available`:'Unavailable'}</span><button onclick="event.stopPropagation();toggleFavorite('${b.id}')" class="fav-btn ${isFav(b.id)?'on':''}">${isFav(b.id)?'♥':'♡'}</button></div></div></article>`}
function header(){return `<header class="nav"><div class="brand" onclick="go('home')">Royal Library<span>.</span></div><nav class="navlinks"><button class="${state.page==='home'?'active':''}" onclick="go('home')">Home</button><button class="${state.page==='catalog'?'active':''}" onclick="go('catalog')">Catalogue</button>${state.user?`<button onclick="go('${state.user.role==='admin'?'admin':'dashboard'}')">${state.user.role==='admin'?'Admin':'My Royal Library'}</button>`:''}</nav><div class="nav-search">⌕<input value="${esc(state.query)}" oninput="state.query=this.value;state.page='catalog';state.catalogPage=1;render()" placeholder="Search books"></div>${state.user?`<button class="nav-action" onclick="logout()">Logout</button><div class="avatar" title="${esc(state.user.name)}">${esc(state.user.name[0])}</div>`:`<button class="nav-action" onclick="go('login')">Sign in</button><button class="primary" style="padding:9px 13px" onclick="go('register')">Create account</button>`}</header>`}
function catalogue(){let cats=['All',...new Set(state.books.map(b=>b.category))];let books=state.books.filter(b=>(state.category==='All'||b.category===state.category)&&(state.availabilityFilter==='all'||(state.availabilityFilter==='available'?b.available_copies>0:b.available_copies===0))&&(`${b.title} ${b.author} ${b.category} ${b.isbn||''} ${b.keywords.join(' ')}`.toLowerCase().includes(state.query.toLowerCase())));books.sort((a,b)=>state.sort==='author'?a.author.localeCompare(b.author):state.sort==='newest'?b.id.localeCompare(a.id):a.title.localeCompare(b.title));let per=8,total=Math.ceil(books.length/per)||1;if(state.catalogPage>total)state.catalogPage=total;let pageBooks=books.slice((state.catalogPage-1)*per,state.catalogPage*per);return `<section class="page"><div class="page-heading"><div><span class="eyebrow">CATALOGUE</span><h1>Explore the collection</h1><p>Search by title, author, ISBN, category, or keyword.</p></div><div class="searchbox">⌕ <input value="${esc(state.query)}" oninput="state.query=this.value;state.catalogPage=1;render()" placeholder="Search the catalogue..."></div></div><div class="chips">${cats.map(c=>`<button class="chip ${state.category===c?'active':''}" onclick="state.category='${esc(c)}';state.catalogPage=1;render()">${esc(c)}</button>`).join('')}</div><div class="filter-row"><select onchange="state.sort=this.value;state.catalogPage=1;render()"><option value="title" ${state.sort==='title'?'selected':''}>Sort: Title</option><option value="author" ${state.sort==='author'?'selected':''}>Sort: Author</option><option value="newest" ${state.sort==='newest'?'selected':''}>Sort: Newest</option></select><select onchange="state.availabilityFilter=this.value;state.catalogPage=1;render()"><option value="all" ${state.availabilityFilter==='all'?'selected':''}>All availability</option><option value="available" ${state.availabilityFilter==='available'?'selected':''}>Available now</option><option value="unavailable" ${state.availabilityFilter==='unavailable'?'selected':''}>Unavailable</option></select><span class="small-note">${books.length} result${books.length!==1?'s':''}</span></div><div class="book-grid">${pageBooks.map(card).join('')}</div>${!books.length?'<div class="empty"><h3>No books match that search.</h3><p>Try another title, author, category, or keyword.</p></div>':`<div class="actions" style="justify-content:center"><button class="ghost" onclick="state.catalogPage=Math.max(1,state.catalogPage-1);render()" ${state.catalogPage===1?'disabled':''}>← Previous</button><span style="padding:13px">Page ${state.catalogPage} of ${total}</span><button class="ghost" onclick="state.catalogPage=Math.min(${total},state.catalogPage+1);render()" ${state.catalogPage===total?'disabled':''}>Next →</button></div>`}</section>`}
function details(id){state.selected=state.books.find(b=>b.id===id);if(state.selected)addActivity('view',id);state.page='details';render()}
function detail(){let b=state.selected;if(!b)return catalogue();let related=recommendations().filter(x=>x.id!==b.id&&x.category===b.category).slice(0,4);return `<section class="page"><button class="back" onclick="go('catalog')">← Back to catalogue</button><div class="details">${cover(b)}<div><span class="category">${esc(b.category)}</span><h1>${esc(b.title)}</h1><p class="author">by ${esc(b.author)}</p><p>${esc(b.description)}</p><div class="meta"><div><small>ISBN</small><b>${esc(b.isbn||'—')}</b></div><div><small>Availability</small><b>${b.available_copies}/${b.total_copies} copies</b></div></div><div class="tags">${b.keywords.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div><div class="actions"><button class="primary" ${b.available_copies>0?'':'disabled'} onclick="borrow('${b.id}')">${b.available_copies>0?'Borrow this book':'Currently unavailable'} →</button><button class="fav-btn ${isFav(b.id)?'on':''}" onclick="toggleFavorite('${b.id}')">${isFav(b.id)?'♥ Saved':'♡ Save to favourites'}</button></div></div></div><div class="section-head"><div><span class="eyebrow">DISCOVERY</span><h2>Related books</h2></div></div><div class="book-grid">${related.map(card).join('')}</div></section>`}
function registerAction(){let name=document.getElementById('regName').value.trim(),email=document.getElementById('regEmail').value.trim().toLowerCase(),password=document.getElementById('regPassword').value,confirm=document.getElementById('regConfirm').value;if(name.length<2){toast('Enter your full name.');return}if(!/^\S+@\S+\.\S+$/.test(email)){toast('Enter a valid email address.');return}if(password.length<6){toast('Password must be at least 6 characters.');return}if(password!==confirm){toast('Passwords do not match.');return}if(state.users.some(x=>x.email.toLowerCase()===email)){toast('An account with this email already exists.');return}let u={id:'u'+Date.now(),name,email,password,role:'member',favorite_ids:[],preferences:[],active:true,created_at:new Date().toISOString().slice(0,10)};state.users.push(u);state.user=u;save();state.page='dashboard';state.memberTab='profile';toast('Account created. Choose your interests to improve recommendations.');render()}
function loginAction(){let email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;if(!email||!password){toast('Enter your email and password.');return}let u=state.users.find(x=>x.email.toLowerCase()===email);if(!u){toast('No account found with that email.');return}if(u.active===false){toast('This account is inactive. Contact the library administrator.');return}if(u.password!==password){toast('Incorrect password.');return}state.user=u;save();state.page=u.role==='admin'?'admin':'dashboard';toast('Signed in successfully.');render()}
function borrow(id){if(!state.user){toast('Sign in to borrow a book.');go('login');return}if(state.user.role!=='member'){toast('Use a member account to borrow books.');return}let b=state.books.find(x=>x.id===id);let active=state.borrowing.filter(x=>x.user_id===state.user.id&&x.status==='borrowed');if(active.length>=3){toast('Borrowing limit reached: 3 active books.');return}if(active.some(x=>x.book_id===id)){toast('You already have this book.');return}if(!b||b.available_copies<1){toast('This book is unavailable.');return}let now=new Date(),due=new Date(now.getTime()+14*86400000);state.borrowing.push({id:'br'+Date.now(),user_id:state.user.id,book_id:id,borrow_date:now.toISOString().slice(0,10),due_date:due.toISOString().slice(0,10),return_date:null,status:'borrowed'});b.available_copies--;b.availability=b.available_copies>0;addActivity('borrow',id);save();toast('Book borrowed. Due in 14 days.');render()}
function ret(id){let br=state.borrowing.find(x=>x.id===id);if(!br||br.status!=='borrowed')return;br.status='returned';br.return_date=new Date().toISOString().slice(0,10);let b=state.books.find(x=>x.id===br.book_id);if(b){b.available_copies=Math.min(b.total_copies,b.available_copies+1);b.availability=b.available_copies>0}addActivity('return',br.book_id);save();toast('Book returned.');render()}
function memberNav(){return `<div class="member-nav">${[['overview','Overview'],['borrowed','My books'],['history','History'],['recommendations','Recommendations'],['favourites','Favourites'],['profile','Profile']].map(([k,l])=>`<button class="${state.memberTab===k?'active':''}" onclick="state.memberTab='${k}';render()">${l}</button>`).join('')}</div>`}
function memberNotifications(){let bs=state.borrowing.filter(x=>x.user_id===state.user.id&&x.status==='borrowed'),o=bs.filter(overdue),d=bs.filter(dueSoon);if(o.length)return `<div class="notice danger-note">You have ${o.length} overdue book${o.length>1?'s':''}. Please return ${o.length>1?'them':'it'} as soon as possible.</div>`;if(d.length)return `<div class="notice">${d.length} book${d.length>1?'s are':' is'} due within 3 days.</div>`;return ''}
function dashboard(){let u=currentUser();state.user=u;let bs=state.borrowing.filter(x=>x.user_id===u.id),active=bs.filter(x=>x.status==='borrowed'),rec=recommendations(),favs=state.books.filter(b=>(u.favorite_ids||[]).includes(b.id));let body='';if(state.memberTab==='overview')body=`${memberNotifications()}<div class="metrics"><div class="metric"><span>Current loans</span><b>${active.length}/3</b></div><div class="metric"><span>Returned</span><b>${bs.filter(x=>x.status==='returned').length}</b></div><div class="metric"><span>Recommendations</span><b>${rec.length}</b></div><div class="metric"><span>Favourites</span><b>${favs.length}</b></div></div><div class="dashboard-grid"><div class="panel"><div class="panel-head"><h3>Current loans</h3><span>${active.length}</span></div>${active.length?active.map(loanRow).join(''):'<div class="empty"><p>No active loans.</p><button class="primary" onclick="go(\'catalog\')">Browse catalogue</button></div>'}</div><div class="panel"><div class="panel-head"><h3>Recommended for you</h3><span>Hybrid</span></div>${rec.slice(0,5).map(recRow).join('')||'<div class="empty"><p>Select interests in your profile or borrow books to improve recommendations.</p></div>'}</div></div>`;else if(state.memberTab==='borrowed')body=`${memberNotifications()}<div class="panel"><div class="panel-head"><h3>My active books</h3><span>${active.length}/3</span></div>${active.map(loanRow).join('')||'<div class="empty"><p>You have no active borrowed books.</p></div>'}</div>`;else if(state.memberTab==='history')body=`<div class="panel"><div class="panel-head"><h3>Borrowing history</h3><span>${bs.length} transactions</span></div>${bs.slice().reverse().map(loanRow).join('')||'<div class="empty"><p>No borrowing history yet.</p></div>'}</div>`;else if(state.memberTab==='recommendations')body=`<div class="panel"><div class="panel-head"><div><h3>Personalized recommendations</h3><span class="small-note">Based on preferences, borrowing activity and similar users.</span></div></div>${rec.map(recRow).join('')||'<div class="empty"><p>Borrow a few books or select interests to generate recommendations.</p></div>'}</div>`;else if(state.memberTab==='favourites')body=`<div class="panel"><div class="panel-head"><h3>Saved favourites</h3><span>${favs.length}</span></div><div class="book-grid">${favs.map(card).join('')}</div>${!favs.length?'<div class="empty"><p>You have not saved any books yet.</p></div>':''}</div>`;else body=profilePage();return `<section class="page"><div class="dash-head"><div><span class="eyebrow">MY ROYAL LIBRARYRY</span><h1>${esc(u.name)}</h1><p>Manage your library account, borrowing activity and recommendations.</p></div></div>${memberNav()}${body}</section>`}
function loanRow(x){let b=state.books.find(y=>y.id===x.book_id);return `<div class="loan"><div class="mini">${esc((b?.title||'?').slice(0,2).toUpperCase())}</div><div><b>${esc(b?.title||'Unknown')}</b><span>Borrowed ${x.borrow_date} · ${statusLabel(x)} · Due ${x.due_date}</span></div>${x.status==='borrowed'?`<button onclick="ret('${x.id}')">Return</button>`:''}</div>`}
function recRow(b){return `<div class="rec" onclick="details('${b.id}')"><div class="mini">${esc(b.title.slice(0,2).toUpperCase())}</div><div><b>${esc(b.title)}</b><span>${esc(b.author)}</span><span class="recommend-reason">${esc(b.reason)}</span></div><strong>${b.score}</strong></div>`}
function profilePage(){let u=currentUser(),cats=['Computer Science','Literature','Personal Development','Business','Psychology','Fiction'];return `<div class="profile-grid"><div class="panel"><div class="panel-head"><h3>Profile</h3></div><label class="field">Full name<input id="pn" value="${esc(u.name)}"></label><label class="field">Email<input id="pe" type="email" value="${esc(u.email)}"></label><button class="primary" onclick="saveProfile()">Save profile</button></div><div class="panel settings-card"><div class="panel-head"><h3>Reading interests</h3></div><p class="small-note">These preferences are used for initial recommendations when you have little borrowing history.</p><div class="checkbox-grid">${cats.map(c=>`<label class="check"><input type="checkbox" value="${esc(c)}" ${u.preferences.includes(c)?'checked':''}>${esc(c)}</label>`).join('')}</div><button class="primary" style="margin-top:15px" onclick="savePreferences()">Save interests</button></div><div class="panel settings-card"><div class="panel-head"><h3>Security</h3></div><label class="field">New password<input id="np" type="password" placeholder="Leave blank to keep current password"></label><label class="field">Confirm new password<input id="npc" type="password"></label><button class="ghost" onclick="changePassword()">Change password</button></div></div>`}
function saveProfile(){let u=currentUser(),name=document.getElementById('pn').value.trim(),email=document.getElementById('pe').value.trim().toLowerCase();if(name.length<2||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Enter a valid name and email.');return}if(state.users.some(x=>x.id!==u.id&&x.email.toLowerCase()===email)){toast('That email is already in use.');return}u.name=name;u.email=email;state.user=u;save();toast('Profile updated.');render()}
function savePreferences(){let u=currentUser();u.preferences=[...document.querySelectorAll('.checkbox-grid input:checked')].map(x=>x.value);state.user=u;save();toast('Reading interests saved.');render()}
function changePassword(){let u=currentUser(),p=document.getElementById('np').value,c=document.getElementById('npc').value;if(!p)return toast('Enter a new password.');if(p.length<6)return toast('Password must be at least 6 characters.');if(p!==c)return toast('Passwords do not match.');u.password=p;state.user=u;save();toast('Password changed.');render()}
function bookForm(){let b=state.editingBook;return `<div class="admin-form"><div class="panel-head"><h3>${b?'Edit book':'Add new book'}</h3>${b?`<button class="admin-btn" onclick="state.editingBook=null;render()">Cancel</button>`:''}</div><div class="form-grid"><label class="field">Title<input id="bt" value="${esc(b?.title||'')}"></label><label class="field">Author<input id="ba" value="${esc(b?.author||'')}"></label><label class="field">Category<select id="bc">${['Computer Science','Literature','Personal Development','Business','Psychology','Fiction'].map(c=>`<option ${b?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">ISBN<input id="bi" value="${esc(b?.isbn||'')}"></label><label class="field">Total copies<input id="bcopies" type="number" min="1" value="${b?.total_copies||3}"></label><label class="field wide">Description<textarea id="bd">${esc(b?.description||'')}</textarea></label><label class="field wide">Keywords<input id="bk" value="${esc((b?.keywords||[]).join(', '))}" placeholder="programming, software, systems"></label></div><button class="primary" onclick="saveBook()">${b?'Save changes':'Add book'} →</button></div>`}
function saveBook(){let title=document.getElementById('bt').value.trim(),author=document.getElementById('ba').value.trim(),copies=Math.max(1,Number(document.getElementById('bcopies').value||1));if(!title||!author){toast('Title and author are required.');return}let data={title,author,category:document.getElementById('bc').value,isbn:document.getElementById('bi').value.trim(),description:document.getElementById('bd').value.trim(),keywords:document.getElementById('bk').value.split(',').map(x=>x.trim()).filter(Boolean)};if(state.editingBook){let b=state.editingBook,borrowed=b.total_copies-b.available_copies;b.total_copies=Math.max(copies,borrowed);b.available_copies=b.total_copies-borrowed;Object.assign(b,data);audit('Updated book',title);toast('Book updated.')}else{state.books.unshift({id:'b'+Date.now(),...data,total_copies:copies,available_copies:copies,availability:true});audit('Added book',title);toast('Book added.')}state.editingBook=null;save();render()}
function adminBooks(){let avail=state.books.filter(b=>b.available_copies>0).length;return adminShell(`${adminHeader('Books','Manage catalogue records, copies, availability and book information.',`<button class="primary" onclick="state.editingBook=null;render()">+ Add book</button>`)}${bookForm()}<div class="panel"><div class="panel-head"><h3>Catalogue inventory</h3><span>${state.books.length} titles · ${state.books.reduce((n,b)=>n+b.total_copies,0)} copies</span></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Book</th><th>Category</th><th>Copies</th><th>Status</th><th>Actions</th></tr></thead><tbody>${state.books.map(b=>`<tr><td><b>${esc(b.title)}</b><br><span>${esc(b.author)}</span></td><td>${esc(b.category)}</td><td>${b.available_copies}/${b.total_copies}</td><td><span class="status-pill ${b.available_copies?'status-green':'status-red'}">${b.available_copies?'Available':'Out'}</span></td><td><button class="admin-btn" onclick="editBook('${b.id}')">Edit</button> <button class="admin-btn danger" onclick="deleteBook('${b.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`)}
function editBook(id){state.editingBook=state.books.find(b=>b.id===id)||null;state.adminTab='books';render()}
function deleteBook(id){let b=state.books.find(x=>x.id===id);if(!b)return;if(state.borrowing.some(x=>x.book_id===id&&x.status==='borrowed')){toast('Return all copies before deleting this title.');return}if(!confirm(`Delete "${b.title}" from the catalogue?`))return;state.books=state.books.filter(x=>x.id!==id);audit('Deleted book',b.title);save();toast('Book deleted.');render()}
function adminMembers(){let members=state.users.filter(x=>x.role==='member');return adminShell(`${adminHeader('Members','Review registered members, status and borrowing activity.') }<div class="panel"><div class="panel-head"><h3>Registered members</h3><span>${members.length} members</span></div><div class="admin-list">${members.map(u=>{let loans=state.borrowing.filter(x=>x.user_id===u.id),active=loans.filter(x=>x.status==='borrowed').length;return `<div class="member-row"><div class="member-avatar">${esc(u.name[0]||'?')}</div><div class="grow"><b>${esc(u.name)}</b><small>${esc(u.email)} · Joined ${u.created_at}</small></div><span>${active} active</span><span class="status-pill ${u.active===false?'status-red':'status-green'}">${u.active===false?'Inactive':'Active'}</span><button class="admin-btn" onclick="toggleMember('${u.id}')">${u.active===false?'Activate':'Suspend'}</button><button class="admin-btn" onclick="viewMember('${u.id}')">History</button></div>`}).join('')||'<div class="admin-empty">No registered members.</div>'}</div></div>${state.selectedMember?memberDetailAdmin(state.selectedMember):''}`)}
function toggleMember(id){let u=state.users.find(x=>x.id===id);if(!u)return;u.active=u.active===false;state.selectedMember=null;audit(u.active?'Activated member':'Suspended member',u.email);save();toast(u.active?'Member activated.':'Member suspended.');render()}
function viewMember(id){state.selectedMember=id;render()}
function memberDetailAdmin(id){let u=state.users.find(x=>x.id===id);if(!u)return '';let rows=state.borrowing.filter(x=>x.user_id===id).reverse();return `<div class="panel" style="margin-top:18px"><div class="panel-head"><h3>${esc(u.name)} — borrowing history</h3><button class="admin-btn" onclick="state.selectedMember=null;render()">Close</button></div>${rows.map(x=>{let b=state.books.find(y=>y.id===x.book_id);return `<div class="loan"><div class="mini">${esc((b?.title||'?').slice(0,2).toUpperCase())}</div><div><b>${esc(b?.title||'Unknown')}</b><span>${x.borrow_date} → ${x.return_date||'Not returned'} · ${statusLabel(x)}</span></div></div>`}).join('')||'<p class="small-note">No transactions.</p>'}</div>`}
function adminLoans(){let rows=state.borrowing.slice().reverse();return adminShell(`${adminHeader('Borrowing & returns','Monitor circulation, due dates and overdue books.') }<div class="metrics"><div class="metric"><span>Total transactions</span><b>${state.borrowing.length}</b></div><div class="metric"><span>Active</span><b>${state.borrowing.filter(x=>x.status==='borrowed').length}</b></div><div class="metric"><span>Returned</span><b>${state.borrowing.filter(x=>x.status==='returned').length}</b></div><div class="metric"><span>Overdue</span><b>${state.borrowing.filter(overdue).length}</b></div></div><div class="panel"><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Member</th><th>Book</th><th>Borrowed</th><th>Due</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(x=>{let u=state.users.find(y=>y.id===x.user_id),b=state.books.find(y=>y.id===x.book_id);return `<tr><td>${esc(u?.name||'Unknown')}</td><td>${esc(b?.title||'Unknown')}</td><td>${x.borrow_date}</td><td>${x.due_date}</td><td><span class="status-pill ${statusClass(x)}">${statusLabel(x)}</span></td><td>${x.status==='borrowed'?`<button class="admin-btn" onclick="adminReturn('${x.id}')">Mark returned</button>`:'—'}</td></tr>`}).join('')}</tbody></table></div></div>`)}
function adminReturn(id){ret(id);audit('Marked borrowing returned',id);state.adminTab='loans';render()}
function adminReports(){let total=state.borrowing.length,returned=state.borrowing.filter(x=>x.status==='returned').length,active=state.borrowing.filter(x=>x.status==='borrowed'),over=active.filter(overdue),copies=state.books.reduce((n,b)=>n+b.total_copies,0),avail=state.books.reduce((n,b)=>n+b.available_copies,0);let popular=state.books.map(b=>({...b,count:state.borrowing.filter(x=>x.book_id===b.id).length})).sort((a,b)=>b.count-a.count).slice(0,5);let max=Math.max(1,...popular.map(x=>x.count));return adminShell(`${adminHeader('Reports & analytics','Collection, circulation and usage reports.') }<div class="admin-card-grid"><div class="admin-stat"><small>Catalogue titles</small><strong>${state.books.length}</strong></div><div class="admin-stat"><small>Total copies</small><strong>${copies}</strong></div><div class="admin-stat"><small>Return rate</small><strong>${total?Math.round(returned/total*100):0}%</strong></div><div class="admin-stat"><small>Availability</small><strong>${copies?Math.round(avail/copies*100):0}%</strong></div></div><div class="admin-cols"><div class="panel"><div class="panel-head"><h3>Most borrowed books</h3></div>${popular.map(x=>`<div class="report-bar"><label><span>${esc(x.title)}</span><span>${x.count}</span></label><div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,x.count/max*100)}%"></div></div></div>`).join('')||'<p class="small-note">No borrowing data yet.</p>'}</div><div class="panel"><div class="panel-head"><h3>Circulation summary</h3></div><div class="loan"><div class="mini">A</div><div><b>Active loans</b><span>Currently borrowed</span></div><strong>${active.length}</strong></div><div class="loan"><div class="mini">R</div><div><b>Returned</b><span>Completed transactions</span></div><strong>${returned}</strong></div><div class="loan"><div class="mini">O</div><div><b>Overdue</b><span>Past due date</span></div><strong>${over.length}</strong></div></div></div><div class="panel" style="margin-top:18px"><div class="panel-head"><h3>Admin audit log</h3></div>${state.audit.slice(0,12).map(a=>`<div class="audit-item"><b>${esc(a.action)}</b><small>${esc(a.details)} · ${new Date(a.date).toLocaleString()}</small></div>`).join('')||'<p class="small-note">No administrative activity recorded.</p>'}</div>`)}
function adminOverview(){let active=state.borrowing.filter(x=>x.status==='borrowed'),over=active.filter(overdue),popular=state.books.map(b=>({...b,count:state.borrowing.filter(x=>x.book_id===b.id).length})).sort((a,b)=>b.count-a.count).slice(0,5);return adminShell(`${adminHeader('Royal Library control centre','Monitor collection, members, circulation and system activity.') }<div class="admin-card-grid"><div class="admin-stat"><small>Total titles</small><strong>${state.books.length}</strong></div><div class="admin-stat"><small>Members</small><strong>${state.users.filter(x=>x.role==='member').length}</strong></div><div class="admin-stat"><small>Active loans</small><strong>${active.length}</strong></div><div class="admin-stat"><small>Overdue</small><strong>${over.length}</strong></div></div><div class="admin-cols"><div class="panel"><div class="panel-head"><h3>Recent borrowing</h3><button class="text-btn" onclick="adminTab('loans')">View all →</button></div>${state.borrowing.slice().reverse().slice(0,7).map(x=>{let u=state.users.find(y=>y.id===x.user_id),b=state.books.find(y=>y.id===x.book_id);return `<div class="loan"><div class="mini">${esc((b?.title||'?').slice(0,2).toUpperCase())}</div><div><b>${esc(b?.title||'Unknown')}</b><span>${esc(u?.name||'Unknown')} · ${statusLabel(x)}</span></div></div>`}).join('')||'<p class="small-note">No borrowing activity yet.</p>'}</div><div class="panel"><div class="panel-head"><h3>Most borrowed</h3></div>${popular.map(x=>`<div class="loan"><div class="mini">${x.count}</div><div><b>${esc(x.title)}</b><span>${esc(x.author)}</span></div></div>`).join('')}</div></div><div class="panel" style="margin-top:18px"><div class="panel-head"><h3>Quick actions</h3></div><div class="quick-grid"><button class="quick" onclick="adminTab('books')"><b>Manage books</b><span>Add, edit, copies and catalogue records.</span></button><button class="quick" onclick="adminTab('members')"><b>Manage members</b><span>Activate, suspend and inspect users.</span></button><button class="quick" onclick="adminTab('reports')"><b>View reports</b><span>Circulation and usage statistics.</span></button></div></div>`)}
function admin(){if(state.adminTab==='books')return adminBooks();if(state.adminTab==='members')return adminMembers();if(state.adminTab==='loans')return adminLoans();if(state.adminTab==='reports')return adminReports();return adminOverview()}
function logout(){state.user=null;save();state.page='home';render()}



/* ========================= REAL SUPABASE ADAPTER ========================= */
const SUPABASE_CONFIG=window.ROYAL_LIBRARY_SUPABASE;
const supabaseClient=(window.supabase&&SUPABASE_CONFIG.projectUrl&&SUPABASE_CONFIG.publishableKey)
  ? window.supabase.createClient(SUPABASE_CONFIG.projectUrl,SUPABASE_CONFIG.publishableKey)
  : null;
let sbCategories=[];
function mapBook(row){return {...row,id:row.id,category:row.categories?.name||'Uncategorized',category_id:row.category_id,availability:row.available_copies>0,keywords:row.keywords||[]}}
function mapProfile(row){return {id:row.id,name:row.full_name,email:row.email||'',role:row.role,status:row.status,active:row.status==='active',created_at:(row.created_at||'').slice(0,10),preferences:[]}}
async function refreshRealData(){
  if(!supabaseClient)return false;
  const {data:{session}}=await supabaseClient.auth.getSession();
  state.user=null;
  const booksQ=await supabaseClient.from('books').select('*,categories(name)').order('created_at',{ascending:false});
  if(booksQ.error){console.warn(booksQ.error);return false}
  state.books=(booksQ.data||[]).map(mapBook);
  const catsQ=await supabaseClient.from('categories').select('*').order('name');
  sbCategories=catsQ.data||[];
  if(session){
    const p=await supabaseClient.from('profiles').select('*').eq('id',session.user.id).single();
    if(!p.error&&p.data){
      state.user=mapProfile(p.data);
      const [bor,fav,pref,notifs,acts]=await Promise.all([
        supabaseClient.from('borrowings').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false}),
        supabaseClient.from('favourites').select('book_id').eq('user_id',session.user.id),
        supabaseClient.from('user_preferences').select('category_id').eq('user_id',session.user.id),
        supabaseClient.from('notifications').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(20),
        supabaseClient.from('activities').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(200)
      ]);
      state.borrowing=bor.data||[];
      state.user.favorite_ids=(fav.data||[]).map(x=>x.book_id);
      state.user.preferences=(pref.data||[]).map(x=>(sbCategories.find(c=>c.id===x.category_id)||{}).name).filter(Boolean);
      state.notifications=notifs.data||[]; state.activities=acts.data||[];
    }
    if(state.user?.role==='admin'){
      const [profiles,allBorrow,audit]=await Promise.all([
        supabaseClient.from('profiles').select('*').order('created_at',{ascending:false}),
        supabaseClient.from('borrowings').select('*').order('created_at',{ascending:false}),
        supabaseClient.from('admin_logs').select('*').order('created_at',{ascending:false}).limit(100)
      ]);
      state.users=(profiles.data||[]).map(mapProfile);
      state.borrowing=allBorrow.data||[];
      state.audit=(audit.data||[]).map(a=>({action:a.action,details:JSON.stringify(a.details||{}),date:a.created_at}));
    }
    else state.users=state.user?[state.user]:[];
  } else {
    state.users=[];state.borrowing=[];state.audit=[];
  }
  return true;
}
function realMode(){return !!supabaseClient}
async function registerAction(){
  const name=document.getElementById('regName').value.trim(),email=document.getElementById('regEmail').value.trim().toLowerCase(),password=document.getElementById('regPassword').value,confirm=document.getElementById('regConfirm').value;
  if(name.length<2)return toast('Enter your full name.');
  if(!/^\S+@\S+\.\S+$/.test(email))return toast('Enter a valid email address.');
  if(password.length<6)return toast('Password must be at least 6 characters.');
  if(password!==confirm)return toast('Passwords do not match.');
  if(!supabaseClient)return toast('Supabase is not configured.');
  const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:name}}});
  if(error)return toast(error.message);
  if(!data.session){toast('Account created. Check your email to confirm the account.');state.page='login';render();return}
  await refreshRealData();state.page='dashboard';state.memberTab='profile';render();toast('Account created successfully.');
}
async function loginAction(){
  const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;
  if(!email||!password)return toast('Enter your email and password.');
  if(!supabaseClient)return toast('Supabase is not configured.');
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)return toast(error.message);
  await refreshRealData();state.page=state.user?.role==='admin'?'admin':'dashboard';render();toast('Signed in successfully.');
}
async function logout(){if(supabaseClient)await supabaseClient.auth.signOut();state.user=null;state.page='home';state.users=[];state.borrowing=[];render()}
async function borrow(id){
  if(!state.user){toast('Sign in to borrow a book.');return go('login');}
  if(!supabaseClient)return toast('Supabase is not configured.');
  const due=new Date(Date.now()+14*86400000).toISOString().slice(0,10);
  const {error}=await supabaseClient.rpc('borrow_book',{p_book_id:id,p_due_date:due});
  if(error)return toast(error.message);
  await refreshRealData();state.selected=state.books.find(b=>b.id===id);toast('Book borrowed. Due in 14 days.');render();
}
async function ret(id){
  if(!supabaseClient)return toast('Supabase is not configured.');
  const {error}=await supabaseClient.rpc('return_book',{p_borrowing_id:id});
  if(error)return toast(error.message);
  await refreshRealData();toast('Book returned.');render();
}
async function saveProfile(){
  const u=state.user,name=document.getElementById('pn').value.trim(),email=document.getElementById('pe').value.trim().toLowerCase();
  if(name.length<2||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Enter a valid name and email.');
  const {error}=await supabaseClient.from('profiles').update({full_name:name,email}).eq('id',u.id);
  if(error)return toast(error.message);await refreshRealData();toast('Profile updated.');render();
}
async function savePreferences(){
  const u=state.user;if(!u)return;
  const names=[...document.querySelectorAll('.checkbox-grid input:checked')].map(x=>x.value);
  const ids=sbCategories.filter(c=>names.includes(c.name)).map(c=>({user_id:u.id,category_id:c.id}));
  const d=await supabaseClient.from('user_preferences').delete().eq('user_id',u.id);if(d.error)return toast(d.error.message);
  if(ids.length){const ins=await supabaseClient.from('user_preferences').insert(ids);if(ins.error)return toast(ins.error.message)}
  await refreshRealData();toast('Reading interests saved.');render();
}
async function changePassword(){const p=document.getElementById('np').value,c=document.getElementById('npc').value;if(!p)return toast('Enter a new password.');if(p.length<6)return toast('Password must be at least 6 characters.');if(p!==c)return toast('Passwords do not match.');const {error}=await supabaseClient.auth.updateUser({password:p});if(error)return toast(error.message);toast('Password changed.');render()}
async function toggleFavorite(id){
  if(!state.user)return go('login');
  const on=(state.user.favorite_ids||[]).includes(id);
  const q=on?supabaseClient.from('favourites').delete().eq('user_id',state.user.id).eq('book_id',id):supabaseClient.from('favourites').insert({user_id:state.user.id,book_id:id});
  const {error}=await q;if(error)return toast(error.message);await refreshRealData();toast(on?'Removed from favourites.':'Added to favourites.');render();
}
async function saveBook(){
  if(!state.user||state.user.role!=='admin')return toast('Administrator access required.');
  const title=document.getElementById('bt').value.trim(),author=document.getElementById('ba').value.trim(),copies=Math.max(1,Number(document.getElementById('bcopies').value||1));
  if(!title||!author)return toast('Title and author are required.');
  const cat=sbCategories.find(c=>c.name===document.getElementById('bc').value);
  const data={title,author,category_id:cat?.id||null,isbn:document.getElementById('bi').value.trim()||null,description:document.getElementById('bd').value.trim(),keywords:document.getElementById('bk').value.split(',').map(x=>x.trim()).filter(Boolean)};
  let result;
  if(state.editingBook){const b=state.editingBook;const borrowed=(b.total_copies||0)-(b.available_copies||0);data.total_copies=Math.max(copies,borrowed);data.available_copies=data.total_copies-borrowed;result=await supabaseClient.from('books').update(data).eq('id',b.id)}
  else {data.total_copies=copies;data.available_copies=copies;result=await supabaseClient.from('books').insert(data)}
  if(result.error)return toast(result.error.message);state.editingBook=null;await refreshRealData();toast('Book saved.');render();
}
async function deleteBook(id){if(!confirm('Delete this book from the catalogue?'))return;const {error}=await supabaseClient.from('books').delete().eq('id',id);if(error)return toast(error.message);await refreshRealData();toast('Book deleted.');render()}
async function toggleMember(id){const u=state.users.find(x=>x.id===id);if(!u)return;const next=u.active===false?'active':'suspended';const {error}=await supabaseClient.from('profiles').update({status:next}).eq('id',id);if(error)return toast(error.message);await refreshRealData();toast(next==='active'?'Member activated.':'Member suspended.');render()}
async function adminReturn(id){await ret(id);state.adminTab='loans';render()}
async function boot(){
  if(!supabaseClient){render();return}
  try{await refreshRealData();supabaseClient.auth.onAuthStateChange(async()=>{setTimeout(async()=>{await refreshRealData();render()},0)});render();}
  catch(e){console.error(e);toast('Could not connect to Royal Library database. Run the Supabase schema first.');render()}
}

boot();
</script>
